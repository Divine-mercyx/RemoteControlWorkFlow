[package]
name = "nolt-agent-core"
version = "0.2.0"
edition = "2021"
description = "Protocol parsing, key mapping and input injection for the Nolt Support agent"
publish = false

[dependencies]
enigo = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
